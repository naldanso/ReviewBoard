<!-- This is the homepage HTML for Review Board.
  It'll be the first page you see when entering the URL! -->

<!DOCTYPE html>
<main>
  <a [routerLink]="['/']">
    <!-- this h1 will eventually become the logo.
    we will include an <img> tag with the class and everything -->
    <header class="brand-name">
      <h1>Review Board</h1>
    </header>
  </a>
  <!-- this contains the meat of the application. all the stuff you see -->
  <!-- <router-outlet> is where the routes get displayed. so details.html will get inserted here -->
  <section class="content">
    <router-outlet/>
  </section>
</main>
