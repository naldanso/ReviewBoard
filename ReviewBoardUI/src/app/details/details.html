<article>
  <img
      class="media-image"
      [src]="mediaImage?.photo"
      alt="photo taken on {{ mediaImage?.date }}"
  />
  <!-- This section would include stuff like ratings, the comment section, etc. stuff to know about the
    photo that the user would've provided via upload. -->
  <section class="image-description">
    <p>This photo was uploaded on {{ mediaImage?.date }}.</p>
  </section>
  <section class="image-misc">
  </section>
</article>
