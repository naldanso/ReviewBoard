<!-- this contains the navigation bar, including the search bar, account button, and website theme buttons -->
<section class="navbar-container">
  <section class="left-section">
    <form>
      <input type="text" placeholder="Find something to review" #filter />
      <button class="primary" type="button" (click)="filterResults(filter.value)">Search</button>
    </form>
  </section>
  <section class="right-section">
    <!--This will contain the account-settings/site-theme part of the navigation bar-->
    <ul class="account-and-theme">
      <li><img class="ul-image" src="account icon.png" alt="account profile image"></li>
      <li><img class="ul-image" src="light mode icon.jpg" alt="light mode icon"></li>
      <li><img class="ul-image" src="dark mode icon.png" alt="dark mode icon"></li>
    </ul>
  </section>
</section>

<!-- this contains the logic to display the array of images/videos on the home page -->
<section class="media-results">
  <!-- literally just a for-loop. -->
  @for(mediaUnit of filteredMediaArr; track $index){
    <app-medialayout [mediaInput]="mediaUnit"></app-medialayout>
  }
</section>
